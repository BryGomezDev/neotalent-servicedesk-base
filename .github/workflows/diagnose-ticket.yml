name: Diagnose oldest unclassified ticket

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-base-action@beta
        with:
          model: claude-sonnet-4-5-20250929
          allowed_tools: "Read,Write"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Read data/tickets.json and docs/spec.md.

            Find the oldest ticket (earliest "fecha" value) where the field "prioridad"
            is missing, null, or an empty string.

            Create the file docs/diagnostico-<id>.md (replace <id> with the ticket's
            actual "id" field) with this structure:

            ## Ticket
            - **ID:** …
            - **Título:** …
            - **Sistema afectado:** …
            - **Zona:** …
            - **Fecha:** …
            - **Reportado por:** …

            ## Diagnóstico de prioridad
            Inferred value (alta / media / baja) and reasoning based on docs/spec.md.

            ## Diagnóstico de categoría
            Inferred category and reasoning based on docs/spec.md.

            ## Acción recomendada
            One concise paragraph describing the next step.

            Do not modify any existing file. Only create the new docs/diagnostico-<id>.md.

      - name: Commit diagnosis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostico-*.md
          git diff --cached --quiet || git commit -m "feat: diagnóstico automático del ticket más antiguo sin clasificar"
          git push